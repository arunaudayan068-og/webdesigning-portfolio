<head>

<body>
    <header>
        <a class="logo" href="index.html">Aruna Udayan</a>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

    <main class="container">
        <section>
            <h1>Contact Me</h1>
            <p>Email: <a href="mailto:arunaudayan068@gmail.com">arunaudayan068@gmail.com</a></p>
            <p>You can also send me a message using this form.</p>

            <form class="contact-form" action="mailto:yourname@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>

                <label for="subject">Subject</label>
                <input id="subject" type="text" name="subject" placeholder="Enter the subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Connect With Me</h2>
            <div class="social-links">
                <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
                <a href="https://github.com/" target="_blank">GitHub</a>
                <a href="https://www.instagram.com/" target="_blank">Instagram</a>
            </div>
        </section>
    </main>
